[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "component-placement-model"
version = "0.1.0"
description = "Generative model for 3D component placement in the GLUE framework"
authors = [
    {name = "Phuc Vu", email = "phucvu@student.ethz.ch"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "numpy",
    "matplotlib",
    "tqdm",
    "wandb",
]

[tool.setuptools.packages.find]
include = ["cpm*"]

[project.optional-dependencies]
dev = [
  "mypy",
  "pytest",
  "ruff",
  "pre-commit",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

line-length = 88

# Assume Python 3.11
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4",   # pycodestyle errors (subset)
    "E7",   # pycodestyle errors (subset)
    "E9",   # pycodestyle errors (subset)
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate
    "PD",   # pandas-vet
    "PGH",  # pygrep-hooks
    "PL",   # pylint
    "TRY",  # tryceratops
    "FLY",  # flynt
    "NPY",  # numpy
    "PERF", # perflint
    "FURB", # refurb
    "LOG",  # flake8-logging
    "RUF",  # Ruff-specific rules
]

ignore = [
    "B008",  # do not perform function calls in argument defaults
    "F401",
    # ML/math naming: uppercase math vars (N, D_MODEL, matrices A), DPP_* fn names
    "N802", "N803", "N806",
    # Math symbols in identifiers (λ for Lagrangian / loss weights)
    "PLC2401", "RUF003",
    # Research-code style: many-arg models, math magic numbers, plain exception args
    "PLR0913", "PLR2004", "TRY003",
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
known-first-party = ["cpm"]

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["PLR2004"]  # allow magic values in tests
# interactive.py is a matplotlib-widget dev tool: callbacks need globals, and it
# keeps commented-out model configs as quick toggles.
"scripts/interactive.py" = ["PLW0602", "PLW0603", "ERA001"]

[tool.mypy]
warn_redundant_casts = true
warn_unused_ignores = true
files = ["cpm/", "tests/"]
exclude = [
  "^build/",
  "^docs/",
]
[[tool.mypy.overrides]]
module = [
  # Put dependencies without type hints here
]
ignore_missing_imports = true
